<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" role="img" aria-labelledby="title desc">
  <title id="title">UMC Desk module architecture</title>
  <desc id="desc">AppDependencies composes seven Features and Core modules. Each Feature's Presentation and Data depend on Domain. Data depends on CoreNetwork, which depends on UMCNetworkKit. Six other Core modules provide shared foundations, dependency injection, routing and future UI boundaries. The diagram omits secondary dependencies.</desc>
  <!-- Created by euijjang97 on 10/6/26. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#567680"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1198" height="768" rx="22" fill="#F8FAFA" stroke="#DCE5E7"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#1A3440">
    <text x="44" y="52" font-size="17" font-weight="600" letter-spacing="2" fill="#567680">ARCHITECTURE OVERVIEW</text>
    <rect x="44" y="78" width="1112" height="86" rx="14" fill="#18323F"/>
    <text x="70" y="115" font-size="28" font-weight="700" fill="#FFFFFF">UMC Desk</text>
    <text x="70" y="143" font-size="18" fill="#B8D2D6">Application composition root</text>
    <text x="920" y="131" font-size="23" fill="#A1E2D1">AppDependencies</text>
    <text x="44" y="214" font-size="24" font-weight="700">7 Features</text>
    <text x="44" y="246" font-size="20" fill="#4E6772">Auth · Home · Notice · Activity · Community · Matching · ProjectWorkspace</text>
    <rect x="44" y="270" width="1112" height="166" rx="14" fill="#FFFFFF" stroke="#DCE5E7"/>
    <rect x="74" y="300" width="276" height="105" rx="12" fill="#EAF0F7"/>
    <text x="212" y="347" text-anchor="middle" font-size="25" font-weight="600">Presentation</text>
    <text x="212" y="377" text-anchor="middle" font-size="17" fill="#526D7B">View / ViewModel boundary</text>
    <rect x="462" y="300" width="276" height="105" rx="12" fill="#DDF2EC"/>
    <text x="600" y="347" text-anchor="middle" font-size="25" font-weight="600">Domain</text>
    <text x="600" y="377" text-anchor="middle" font-size="17" fill="#526D7B">Models / protocols boundary</text>
    <rect x="850" y="300" width="276" height="105" rx="12" fill="#FCF0DF"/>
    <text x="988" y="347" text-anchor="middle" font-size="25" font-weight="600">Data</text>
    <text x="988" y="377" text-anchor="middle" font-size="17" fill="#526D7B">Repository / API boundary</text>
    <g fill="none" stroke="#567680" stroke-width="2" marker-end="url(#arrow)">
      <path d="M350 352H453"/>
      <path d="M850 352H747"/>
      <path d="M988 405V470H784V492"/>
      <path d="M570 529H468"/>
    </g>
    <rect x="570" y="492" width="586" height="78" rx="12" fill="#E5F0F0" stroke="#C9DFDF"/>
    <text x="594" y="525" font-size="24" font-weight="600">CoreNetwork</text>
    <text x="594" y="551" font-size="18" fill="#526D7B">Keychain token storage / session reset wiring</text>
    <rect x="44" y="492" width="416" height="78" rx="12" fill="#FFFFFF" stroke="#C9DFDF"/>
    <text x="68" y="525" font-size="24" font-weight="600">UMCNetworkKit</text>
    <text x="68" y="551" font-size="18" fill="#526D7B">Moya / NetworkClient actor / URLSession</text>
    <text x="44" y="621" font-size="24" font-weight="700">Shared Core</text>
    <text x="44" y="650" font-size="18" fill="#526D7B">Additional modules · secondary dependencies omitted</text>
    <rect x="44" y="673" width="1112" height="53" rx="12" fill="#ECF0F2"/>
    <text x="600" y="706" text-anchor="middle" font-size="19">UMCFoundation · CoreDomain · CoreDI · CoreRouting · CoreDesignSystem · CoreUIComponents</text>
  </g>
</svg>
