# Created by euijjang97 on 10/6/26.
name: Tuist CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: tuist-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test macOS modules
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    defaults:
      run:
        working-directory: UMCDesk
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Verify Xcode 27.2
        run: |
          xcode_version="$(xcodebuild -version)"
          echo "$xcode_version"
          grep -Fxq 'Xcode 27.2' <<< "$xcode_version"
      - name: Test automation scripts
        run: |
          python3 -m unittest discover -s ../tools/tests -v
          node --test ../tools/tests/*.test.mjs
      - name: Install pinned Tuist
        uses: jdx/mise-action@v4
        with:
          working_directory: UMCDesk
          install: true
          cache: true
      - name: Install dependencies
        run: make install
      - name: Generate workspace
        run: make generate
      - name: Test Aquila integration
        run: make test-network
      - name: Test macOS app and DI
        run: make test CODE_SIGNING_ALLOWED=NO
      - name: Build Release
        run: make build CONFIGURATION=Release CODE_SIGNING_ALLOWED=NO
      - name: Verify prerelease display controls
        run: |
          make generate TUIST_PRERELEASE=1
          make test SCHEME=CoreDesignSystem CONFIGURATION=Release CODE_SIGNING_ALLOWED=NO
          make build CONFIGURATION=Release CODE_SIGNING_ALLOWED=NO
