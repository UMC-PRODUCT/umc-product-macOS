name: Tuist CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: tuist-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test macOS modules
    runs-on: macos-26
    defaults:
      run:
        working-directory: UMCDesk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pinned Tuist
        uses: jdx/mise-action@v2
        with:
          working_directory: UMCDesk
          install: true
          cache: true
      - name: Install dependencies
        run: make install
      - name: Generate workspace
        run: make generate
      - name: Test shared network package
        run: make test-network
      - name: Test macOS app and DI
        run: make test CODE_SIGNING_ALLOWED=NO
      - name: Build Release
        run: make build CONFIGURATION=Release CODE_SIGNING_ALLOWED=NO
