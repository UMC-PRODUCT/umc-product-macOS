name: Discord CI Notification

on:
  workflow_run:
    workflows: ["Tuist CI"]
    types: [completed]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send CI result to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL Secret is not configured." >&2
            exit 1
          fi

          jq -n \
            --slurpfile event "$GITHUB_EVENT_PATH" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg server "$GITHUB_SERVER_URL" \
            '$event[0].workflow_run as $run
            | ($run.conclusion // "unknown") as $result
            | (if $result == "success" then
                {label: "SUCCESS ✅", color: 5763719}
              elif $result == "failure" or $result == "timed_out" then
                {label: (($result | ascii_upcase) + " ❌"), color: 15548997}
              elif $result == "cancelled" then
                {label: "CANCELLED ⚠️", color: 16705372}
              else
                {label: (($result | ascii_upcase) + " ⚪"), color: 9807270}
              end) as $status
            | {
              allowed_mentions: {parse: []},
              embeds: [{
                title: "UMCDesk (Tuist) CI Build Result",
                url: $run.html_url,
                color: $status.color,
                fields: ([
                  {name: "Build Status", value: $status.label, inline: true},
                  {name: "Branch", value: ($run.head_branch // "Unknown"), inline: true},
                  {
                    name: "Commit",
                    value: ("`" + $run.head_sha[0:7] + "` by "
                      + ($run.actor.login // $run.head_commit.author.name // "Unknown")),
                    inline: true
                  }
                ] + (if ($run.pull_requests // [] | length) > 0 then
                  [{
                    name: "PR",
                    value: ($run.pull_requests | map(
                      $server + "/" + $repo + "/pull/" + (.number | tostring)
                    ) | join("\n")),
                    inline: false
                  }]
                else [] end)),
                footer: {text: $repo}
              }]
            }' > payload.json

          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --header "Content-Type: application/json" \
            --data-binary @payload.json \
            "$DISCORD_WEBHOOK_URL"
