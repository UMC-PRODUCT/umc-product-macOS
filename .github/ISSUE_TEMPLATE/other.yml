name: 🍀 기타 작업
description: 분류되지 않는 기타 작업을 관리할 때 사용합니다.
title: "🍀 ETC: "
labels: ["Chore"]
body:
  - type: textarea
    id: description
    attributes:
      label: 📌 작업 목적
      placeholder: ex) Xcode 빌드 세팅 변경 필요
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: 🤔 배경
      placeholder: 왜 이 작업이 필요한가요?
    validations:
      required: false

  - type: textarea
    id: tasks
    attributes:
      label: ✅ 완료 조건
      value: |
        - [ ]
      placeholder: |
        - [ ] 설정 파일 수정
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### 서버 확인과 협업 담당자
        [서버 레포](https://github.com/UMC-PRODUCT/umc-product-server)에서 실제 지원 범위를 확인하고,
        [Handbook 담당자 표](https://github.com/UMC-PRODUCT/umc-product-handbook/blob/main/ownership-registry.md)의 최신 팀·닉네임·역할을 아래에 기록해주세요.

        - 제품 요구사항·우선순위: 해당 목적팀 DRI / 공통 인증·권한·API 계약: Platform
        - 환경설정·배포: Infrastructure / 공통 디자인 시스템·토큰·컴포넌트: Design Platform
        - 서버·디자인의 공통 기술·품질 검토: 해당 챕터 Lead

        세부 실행자가 미정이면 팀 DRI에게 연결을 요청하고, 담당 팀이 불명확하면 Discord `총괄단-문의`에서 `@UMC PRODUCT 총괄단`에 문의해주세요.

  - type: dropdown
    id: server-support
    attributes:
      label: 🖥️ 서버 지원 상태
      description: 개발 기능과 디자인에 필요한 데이터·권한·동작을 서버 Controller·DTO 기준으로 확인해주세요.
      options:
        - 지원 확인됨
        - 일부 지원 — 서버 변경 필요
        - 미지원 — 신규 서버 기능 필요
        - 확인 필요
        - 서버 연동 없음
    validations:
      required: true

  - type: textarea
    id: collaboration-handoff
    attributes:
      label: 🤝 서버 확인 근거 및 협업 전달
      description: |
        미지원·변경 필요·확인 필요라면 부족한 요구사항과 누구에게 무엇을 요청할지 작성해주세요.
        서버가 지원하더라도 환경설정·디자인 등 다른 팀의 도움이 필요하면 기록해주세요.
        협업이 필요 없으면 확인 근거와 함께 "협업 불필요" 및 이유를 적어주세요. 요청을 보낸 것과 합의된 것을 구분해주세요.
      placeholder: |
        서버 확인 근거: Controller·DTO·API 링크와 확인 범위 (연동이 없으면 해당 없음)
        부족한 기능·데이터·권한·동작:
        담당 팀 / 전달 대상(닉네임·역할):
        요청할 작업 / 완료 조건:
        관련 이슈·Figma:
        전달·합의 상태: 미전달 / 논의 중 / 합의 완료
        Handbook 근거: 링크와 확인일
    validations:
      required: true
